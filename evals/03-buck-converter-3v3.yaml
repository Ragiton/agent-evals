id: buck-converter-3v3
title: "Buck Converter 12V → 3.3V (TPS54331)"
version: 1.0.0
difficulty: 4
estimated_minutes: 60
category: kicad/power

description: |
  Design a buck converter using the TI TPS54331DR switching regulator. Input
  12 V, output 3.3 V at up to 3 A. Includes input/output bulk caps, output
  ripple filter, feedback divider, and bootstrap cap. This is a real reference
  design scenario; the agent must follow the datasheet's recommended layout.

functional_requirements:
  - TPS54331DR (SO-PowerPAD-8) switching regulator
  - Input: 12 V, 0.5 A nominal
  - Output: 3.3 V, 3 A max
  - Bootstrap capacitor (pin 6 to SW, 100 nF)
  - Feedback divider R10/R11 sized for 3.3 V out (Vref = 0.8 V)
  - Input bulk cap (low-ESR, e.g. 22 µF/25 V)
  - Output caps (low-ESR ceramics, 2x 22 µF/6.3 V)
  - Inductor: 15 µH, 4 A saturation
  - EN pin pulled up to VIN
  - PowerPAD thermal pad connected to bottom GND pour

engineering_requirements:
  - ERC clean
  - DRC clean
  - Switch-node trace width >= 1.0 mm for 3 A
  - Feedback trace routed away from switch node (no crosstalk)
  - Input cap placed close to VIN pin
  - Output cap placed close to SW/LX node
  - GND pour on bottom layer, stitched with vias around switch node
  - Read the TPS54331 datasheet for layout guidelines before laying out

prompt: |
  Design a 12 V → 3.3 V / 3 A buck converter using TPS54331DR in KiCad.

  Required:
  - IC: TPS54331DR (SO-PowerPAD-8 footprint with thermal pad)
  - Input: 12 V DC, 2.1 mm barrel jack footprint
  - Output: 3.3 V on a 2-pin header (VOUT, GND)
  - L = 15 µH, 4 A saturation (e.g. Coilcraft XAL4030 or similar)
  - Input cap: 22 µF / 25 V X7R ceramic, 1210
  - Output caps: 2x 22 µF / 6.3 V X7R ceramic, 1210
  - Bootstrap cap: 100 nF / 25 V, 0402
  - R10 / R11 feedback divider: target 3.3 V out, Vref = 0.8 V, pick standard E96 values
  - EN tied to VIN via 100 kΩ + 10 nF slow-start network
  - Slow-start/UVLO resistors if applicable
  - PowerPAD thermal pad connected to GND pour with multiple vias (>= 5)

  Constraints:
  - File base: buck-12v-3v3
  - 2-layer board, 1.6 mm FR4, 2 oz copper recommended (or 1 oz with net-tie adjustments)
  - All placement per TPS54331 datasheet layout guidelines
  - Place outputs in:
    ./buck-12v-3v3.kicad_pro
    ./buck-12v-3v3.kicad_sch
    ./buck-12v-3v3.kicad_pcb
    ./gerbers/
    ./BOM.csv

  Verify ERC + DRC clean before finishing.

inputs:
  base_files: []
  environment: docker://kicad/kicad:9.0
  working_dir: ./workspace/

outputs:
  - buck-12v-3v3.kicad_pro
  - buck-12v-3v3.kicad_sch
  - buck-12v-3v3.kicad_pcb
  - gerbers/*.gtl
  - gerbers/*.gbl
  - gerbers/*.drl
  - BOM.csv

grading:
  deterministic:
    - name: schematic_erc_clean
      command: "kicad-cli sch erc {kicad_sch} --exit-code"
      pass: exit_code == 0
    - name: pcb_drc_clean
      command: "kicad-cli pcb drc {kicad_pcb} --exit-code"
      pass: exit_code == 0
    - name: gerbers_exported
      check: "[ -d gerbers ] && [ $(ls gerbers/*.gtl 2>/dev/null | wc -l) -ge 1 ]"
      pass: count >= 1
    - name: powerpad_in_design
      check: "grep -i 'TPS54331\\|powerpad\\|thermal' {kicad_pcb} | head -1"
      pass: present
    - name: inductor_in_bom
      check: "grep -i '15uH\\|15µH\\|inductor' BOM.csv"
      pass: present
  llm_judge:
    enabled: true
    model: gpt-5.6-luna
    prompt: |
      Examine the buck converter design. Verify:
      1. Feedback divider values are correct (Vfb = 0.8 V, Rtop/Rbottom ratio = 3.3/0.8 - 1 = 3.125)
      2. Bootstrap cap is connected between pin 6 (BOOT) and pin 5 (SW/LX) of TPS54331
      3. Input bulk cap is placed close to input pin
      4. Output caps are placed close to switch node
      5. PowerPAD has >= 5 GND stitching vias
      6. Switch node trace is short and wide (>= 1.0 mm)
      7. Feedback trace is routed away from switch node
      Rate 1-5 for each.
  weights:
    deterministic: 0.45
    llm_judge: 0.55

passing_threshold: 0.7

metadata:
  area_of_test: [switching_regulator, datasheet_compliance, thermal, power_layout]
  layer_count: 2
  estimated_components: 12
