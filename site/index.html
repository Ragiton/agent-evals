        <div class="panel"><div class="panel-heading"><h2>Grader breakdown</h2><span class="hint">evidence stays attached to each check</span></div><div class="panel-body">${run.deterministic.length ? `<ul class="check-list">${run.deterministic.map(renderCheck).join('')}</ul>` : '<div class="empty-state"><strong>No deterministic checks</strong><p>This run has no check records in results.json.</p></div>'}${run.llmJudge !== null ? `<div class="subpanel" style="margin-top:14px"><h3>LLM judge</h3><div class="subpanel-body"><pre>${escapeHtml(prettyValue(run.llmJudge))}</pre></div></div>` : '<p class="not-included" style="margin-top:14px">LLM judge is deferred or absent; this is not rendered as a failed grade.</p>'}<div class="subpanel" style="margin-top:14px"><h3>Cross-grades</h3><div class="subpanel-body">${renderCrossGrades(run)}</div></div></div></div>
        <div class="panel"><div class="panel-heading"><h2>Transcript</h2><span class="hint">structured JSON is pretty-printed; plain text is preserved</span></div><div class="panel-body">${renderTranscript(run)}</div></div>
        <div class="panel"><div class="panel-heading"><h2>Tool calls</h2><span class="hint">only explicit records are shown</span></div><div class="panel-body">${renderToolCalls(run)}</div></div>
        ${renderRunCost(run)}
        ${renderRunImages(run)}
        <div class="panel"><div class="panel-heading"><h2>Captured files</h2><span class="hint">safe relative links · diagnostics stay secondary</span></div><div class="panel-body">${renderArtifacts(run.artifacts)}</div></div>
        ${run.notes ? `<div class="panel"><div class="panel-heading"><h2>Run notes</h2></div><div class="panel-body prose"><p>${escapeHtml(run.notes)}</p></div></div>` : ''}
      </section>`;
    }

    function renderNotFound(kind, id) {
      return `<section><div class="breadcrumb"><a href="#/overview">Monitor</a><span class="sep">/</span><span>not found</span></div><div class="empty-state"><strong>${escapeHtml(kind)} not found</strong><p>No ${escapeHtml(kind.toLowerCase())} with id <code>${escapeHtml(id)}</code> exists in this results bundle. Return to the <a href="#/overview">overview</a>.</p></div></section>`;
    }

    function parseRoute() {
      const raw = location.hash.replace(/^#/, '') || '/overview';
      const [path, queryString = ''] = raw.split('?');
      const pieces = path.split('/').filter(Boolean).map((piece) => { try { return decodeURIComponent(piece); } catch (_) { return piece; } });
      const query = new URLSearchParams(queryString);
      if (pieces[0] === 'eval' && pieces[1]) return { view: 'eval', id: pieces.slice(1).join('/') };
      if (pieces[0] === 'run' && pieces[1]) return { view: 'run', id: pieces.slice(1).join('/') };
      return { view: 'overview', mode: query.get('mode') || 'monitor' };
    }

    function updateNav(route) {
      $$('[data-nav]').forEach((link) => {
        const nav = link.dataset.nav;
        link.setAttribute('aria-current', (route.view === 'overview' && ((nav === 'compare' && route.mode === 'compare') || (nav === 'overview' && route.mode !== 'compare'))) ? 'page' : 'false');
      });
    }

    function bindOverviewControls() {
      $$('[data-control]').forEach((control) => control.addEventListener(control.tagName === 'INPUT' ? 'input' : 'change', () => {
        runtime.overview[control.dataset.control] = control.value;
        render();
      }));
      const clear = $('[data-action="clear-filters"]');
      if (clear) clear.addEventListener('click', () => {
        runtime.overview.query = ''; runtime.overview.eval = ''; runtime.overview.agent = ''; runtime.overview.model = ''; runtime.overview.skill = '';
        render();
      });
    }

    function bindRunControls() {
      $$('[data-transcript]').forEach((button) => button.addEventListener('click', () => { runtime.transcriptTab = button.dataset.transcript; render(); }));
    }

    function render() {
      if (!runtime.data) return;
      const route = parseRoute();
      updateNav(route);
      if (route.view === 'eval') {
        const evalRecord = runtime.data.evalById.get(route.id);
        app.innerHTML = evalRecord ? renderEvalDetail(evalRecord) : renderNotFound('Eval', route.id);
      } else if (route.view === 'run') {
        const run = runtime.data.runs.find((item) => item.runId === route.id);
        app.innerHTML = run ? renderRunDetail(run) : renderNotFound('Run', route.id);
        bindRunControls();
      } else {
        app.innerHTML = route.mode === 'compare' ? renderCompare(runtime.data) : renderOverview(runtime.data);
        if (route.mode !== 'compare') bindOverviewControls();
      }
    }

    function renderError(error) {
      headerMeta.textContent = 'results bundle unavailable';
      app.innerHTML = `<section><div class="view-header"><div><p class="eyebrow">Archive / loader error</p><h1>Results unavailable</h1></div></div><div class="notice error"><div><strong>Could not load the results bundle.</strong><p>${escapeHtml(error.message)}</p><p class="row-subtitle">Serve the project root with <code>python -m http.server</code>, or publish a co-located <code>results.json</code> beside this page.</p></div><button class="button" type="button" data-action="retry">retry</button></div></section>`;
      const retry = $('[data-action="retry"]');
      if (retry) retry.addEventListener('click', initialize);
    }

    async function initialize() {
      app.innerHTML = '<div class="loading">Loading results bundle</div>';
      try {
        const loaded = await loadResults();
        runtime.raw = loaded.raw;
        runtime.sourceUrl = loaded.sourceUrl;
        runtime.data = normalizeDocument(loaded.raw, loaded.sourceUrl);
        await discoverLegacyArtifacts(runtime.data);
        headerMeta.innerHTML = `<span class="source">${escapeHtml(runtime.data.meta.schemaVersion)}</span> · generated ${escapeHtml(formatDate(runtime.data.meta.generatedAt))} · source <span class="mono">${escapeHtml(new URL(runtime.sourceUrl).pathname)}</span>`;
        render();
      } catch (error) { renderError(error); }
    }

    window.addEventListener('hashchange', render);
    initialize();
  })();
  </script>
</body>
</html>
