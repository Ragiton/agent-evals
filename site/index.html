<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Agent Evals / Archive</title>
  <meta name="license" content="GPL-3.0-or-later">
  <meta name="copyright" content="Copyright (C) 2026 Ragiton">
  <link rel="license" href="../LICENSE">
  <style>
    :root {
      --bg: #101214;
      --surface: #16191c;
      --surface-2: #1c2024;
      --surface-3: #22272c;
      --line: #30363c;
      --line-strong: #465057;
      --text: #e4e8e9;
      --muted: #9aa4a7;
      --faint: #687277;
      --teal: #6dbbb4;
      --teal-dim: #3d817d;
      --green: #71bd91;
      --green-bg: #172a24;
      --rust: #dc856b;
      --rust-bg: #2d1d1b;
      --ochre: #d5af59;
      --ochre-bg: #2c2618;
      --blue: #83abd6;
      --blue-bg: #192535;
      --purple: #b5a1d8;
      --radius: 3px;
      --sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    }

    * { box-sizing: border-box; }
    html { min-width: 320px; background: var(--bg); }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.5 var(--sans);
    }
    a { color: var(--teal); text-decoration: none; }
    a:hover { color: #a2ddd7; text-decoration: underline; }
    button, input, select { font: inherit; }
    button, a, input, select, summary { outline-color: var(--teal); }
    button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible {
      outline: 2px solid var(--teal);
      outline-offset: 2px;
    }
    code, .mono { font-family: var(--mono); font-size: .9em; }
    code { color: #d0d9da; }
    pre {
      max-width: 100%;
      margin: 0;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      color: #ccd4d5;
      font: 12px/1.55 var(--mono);
    }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 20;
      border-bottom: 1px solid var(--line);
      background: rgba(16, 18, 20, .97);
    }
    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      max-width: 1480px;
      min-height: 64px;
      margin: 0 auto;
      padding: 10px 24px;
    }
    .masthead { min-width: 0; }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--text);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: .09em;
      text-transform: uppercase;
    }
    .brand-mark {
      width: 9px;
      height: 9px;
      border: 1px solid var(--teal);
      background: var(--teal-dim);
      box-shadow: 0 0 0 3px rgba(109, 187, 180, .1);
    }
    .header-meta {
      margin-top: 2px;
      color: var(--muted);
      font: 11px var(--mono);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .header-meta .source { color: var(--teal); }
    .main-nav { display: flex; gap: 3px; flex: 0 0 auto; }
    .nav-link {
      min-height: 42px;
      border: 1px solid transparent;
      border-radius: var(--radius);
      padding: 10px 13px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      text-transform: uppercase;
      font-size: 11px;
      letter-spacing: .08em;
    }
    .nav-link:hover, .nav-link[aria-current="page"] {
      border-color: var(--line);
      background: var(--surface-2);
      color: var(--text);
      text-decoration: none;
    }

    main {
      width: min(1480px, 100%);
      margin: 0 auto;
      padding: 26px 24px 48px;
    }
    .view-header {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 20px;
      margin-bottom: 20px;
    }
    .eyebrow {
      margin: 0 0 5px;
      color: var(--teal);
      font: 11px var(--mono);
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    h1, h2, h3, h4 { margin: 0; font-weight: 600; }
    h1 { font-size: clamp(24px, 3vw, 34px); line-height: 1.15; letter-spacing: -.02em; }
    h2 { font-size: 18px; line-height: 1.25; }
    h3 { font-size: 15px; line-height: 1.3; }
    h4 { color: var(--muted); font-size: 11px; letter-spacing: .09em; text-transform: uppercase; }
    .lede { max-width: 760px; margin: 7px 0 0; color: var(--muted); }
    .view-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 7px; }

    .button, .select, .input {
      min-height: 40px;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--text);
    }
    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 8px 12px;
      cursor: pointer;
    }
    .button:hover { border-color: var(--teal-dim); background: var(--surface-2); text-decoration: none; }
    .button.primary { border-color: var(--teal-dim); color: #b9e4df; }
    .button.ghost { border-color: var(--line); color: var(--muted); }
    .select { padding: 8px 32px 8px 10px; }
    .input { width: 100%; padding: 8px 10px; }
    .input::placeholder { color: var(--faint); }
    .control-label { display: grid; gap: 5px; color: var(--muted); font-size: 11px; }

    .notice {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin: 0 0 18px;
      border: 1px solid var(--line);
      border-left: 3px solid var(--ochre);
      padding: 11px 13px;
      background: var(--ochre-bg);
      color: #ddcfaa;
    }
    .notice.error { border-left-color: var(--rust); background: var(--rust-bg); color: #e8c0b2; }
    .notice strong { color: var(--text); }
    .notice p { margin: 0; }
    .notice .button { margin-left: auto; flex: 0 0 auto; min-height: 32px; padding: 5px 9px; }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(120px, 1fr));
      gap: 1px;
      margin-bottom: 24px;
      border: 1px solid var(--line);
      background: var(--line);
    }
    .stat {
      min-height: 92px;
      padding: 14px 15px;
      background: var(--surface);
    }
    .stat-label { color: var(--muted); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
    .stat-value { margin-top: 5px; color: var(--text); font: 26px/1.1 var(--mono); }
    .stat-value.pass { color: var(--green); }
    .stat-value.fail { color: var(--rust); }
    .stat-value.incomplete { color: var(--ochre); }
    .stat-note { margin-top: 4px; color: var(--faint); font-size: 11px; }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: end;
      gap: 10px;
      margin-bottom: 14px;
      padding: 13px;
      border: 1px solid var(--line);
      background: var(--surface);
    }
    .toolbar .control { flex: 1 1 145px; min-width: 120px; }
    .toolbar .control.wide { flex-basis: 230px; }
    .toolbar .control.tight { flex: 0 1 135px; }
    .toolbar .button { align-self: end; }
    .toolbar-note { flex: 1 1 100%; color: var(--faint); font-size: 11px; }

    .section-title {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 15px;
      margin: 22px 0 9px;
    }
    .section-title h2 { font-size: 13px; color: var(--muted); letter-spacing: .1em; text-transform: uppercase; }
    .section-title .count { color: var(--faint); font: 11px var(--mono); }

    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--line);
      background: var(--line);
    }
    table { width: 100%; min-width: 980px; border-collapse: collapse; }
    th, td { padding: 11px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
    th {
      background: var(--surface-3);
      color: var(--muted);
      font: 10px var(--mono);
      letter-spacing: .09em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    td { background: var(--surface); }
    tbody tr:last-child td { border-bottom: 0; }
    tbody tr:hover td { background: var(--surface-2); }
    .row-title { color: var(--text); font-weight: 600; }
    .row-subtitle { margin-top: 2px; color: var(--muted); font-size: 11px; }
    .cell-stack { display: grid; gap: 2px; }
    .cell-right { text-align: right; }
    .score { color: var(--text); font: 600 13px var(--mono); }
    .score.muted { color: var(--faint); }
    .threshold { color: var(--muted); font: 11px var(--mono); }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 24px;
      border: 1px solid currentColor;
      border-radius: 2px;
      padding: 3px 7px;
      font: 10px var(--mono);
      letter-spacing: .07em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .status.pass { color: var(--green); background: var(--green-bg); }
    .status.fail { color: var(--rust); background: var(--rust-bg); }
    .status.incomplete { color: var(--ochre); background: var(--ochre-bg); }
    .status.running { color: var(--blue); background: var(--blue-bg); }
    .status.unknown { color: var(--muted); background: var(--surface-2); }
    .missing { color: var(--faint); }
    .missing::after { content: " · unavailable"; font-size: 10px; }
    .chip-list { display: flex; flex-wrap: wrap; gap: 4px; }
    .chip {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      border: 1px solid var(--line-strong);
      border-radius: 2px;
      padding: 2px 6px;
      color: var(--muted);
      font: 10px var(--mono);
      white-space: nowrap;
    }
    .chip.teal { border-color: var(--teal-dim); color: #a6d8d3; }
    .chip.green { border-color: #407b5d; color: var(--green); }
    .chip.rust { border-color: #875041; color: var(--rust); }
    .chip.ochre { border-color: #806a31; color: var(--ochre); }
    .chip.blue { border-color: #4c6990; color: var(--blue); }

    .empty-state {
      border: 1px dashed var(--line-strong);
      padding: 31px 22px;
      background: var(--surface);
      color: var(--muted);
      text-align: center;
    }
    .empty-state strong { display: block; margin-bottom: 4px; color: var(--text); }
    .empty-state p { max-width: 620px; margin: 0 auto; }

    .breadcrumb { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; margin-bottom: 16px; color: var(--muted); font: 11px var(--mono); }
    .breadcrumb .sep { color: var(--faint); }
    .identity {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 20px;
      align-items: start;
      margin-bottom: 22px;
      padding-bottom: 19px;
      border-bottom: 1px solid var(--line);
    }
    .identity h1 { max-width: 950px; }
    .identity-id { margin-top: 7px; color: var(--teal); font: 12px var(--mono); overflow-wrap: anywhere; }
    .identity-description { max-width: 850px; margin: 13px 0 0; color: var(--muted); white-space: pre-line; }
    .meta-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 1px;
      margin: 17px 0;
      border: 1px solid var(--line);
      background: var(--line);
    }
    .meta-item { min-width: 0; padding: 10px 12px; background: var(--surface); }
    .meta-item dt { color: var(--faint); font: 10px var(--mono); letter-spacing: .08em; text-transform: uppercase; }
    .meta-item dd { margin: 4px 0 0; color: var(--text); overflow-wrap: anywhere; }

    .panel {
      margin-bottom: 14px;
      border: 1px solid var(--line);
      background: var(--surface);
    }
    .panel-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 15px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      background: var(--surface-2);
    }
    .panel-heading h2 { font-size: 13px; letter-spacing: .07em; text-transform: uppercase; }
    .panel-heading .hint { color: var(--faint); font-size: 11px; }
    .panel-body { padding: 14px; }
    .panel-body > :first-child { margin-top: 0; }
    .panel-body > :last-child { margin-bottom: 0; }
    .two-col { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .three-col { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: var(--line); }
    .three-col > * { background: var(--surface); }
    .subpanel { min-width: 0; border: 1px solid var(--line); background: var(--surface); }
    .subpanel h3 { padding: 10px 12px; border-bottom: 1px solid var(--line); background: var(--surface-2); font-size: 12px; }
    .subpanel-body { padding: 12px; }
    .prose { color: var(--muted); white-space: pre-line; }
    .prose p { margin: 0 0 10px; }
    .prose ul, .prose ol { margin: 7px 0 0; padding-left: 20px; }
    .prose li + li { margin-top: 5px; }
    .not-included { color: var(--faint); font-size: 12px; }
    .not-included strong { color: var(--muted); }

    .check-list { margin: 0; padding: 0; list-style: none; }
    .check-item { border-bottom: 1px solid var(--line); }
    .check-item:last-child { border-bottom: 0; }
    .check-main { display: flex; align-items: center; gap: 9px; padding: 9px 0; }
    .check-icon { width: 18px; height: 18px; border: 1px solid currentColor; border-radius: 50%; color: var(--muted); text-align: center; font: 12px/16px var(--mono); flex: 0 0 auto; }
    .check-icon.pass { color: var(--green); }
    .check-icon.fail { color: var(--rust); }
    .check-icon.pending { color: var(--ochre); }
    .check-name { min-width: 0; color: var(--text); overflow-wrap: anywhere; }
    .check-tail { margin-left: auto; color: var(--faint); font: 11px var(--mono); white-space: nowrap; }
    details.evidence { margin: 0 0 10px 27px; border-left: 1px solid var(--line-strong); }
    details.evidence summary { padding: 5px 9px; color: var(--teal); cursor: pointer; font-size: 11px; }
    .evidence-body { display: grid; gap: 8px; padding: 7px 9px 10px; background: #121517; }
    .evidence-label { margin-bottom: 4px; color: var(--faint); font: 10px var(--mono); letter-spacing: .07em; text-transform: uppercase; }

    .run-table td { font-size: 12px; }
    .run-table td:first-child { min-width: 170px; }
    .run-table .run-link { color: var(--text); font: 12px var(--mono); }
    .run-table .run-link:hover { color: var(--teal); }
    .time { color: var(--muted); font: 11px var(--mono); white-space: nowrap; }

    .artifact-groups { display: grid; gap: 13px; }
    .image-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 14px; }
    .image-frame { margin: 0; border: 1px solid var(--line); background: var(--surface-2); }
    .image-frame img { display: block; width: 100%; height: auto; background: #0d0f11; }
    .image-frame figcaption { padding: 8px 11px; color: var(--muted); font: 11px var(--mono); border-top: 1px solid var(--line); }
    .artifact-group h3 { margin-bottom: 5px; color: var(--muted); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
    .artifact-list { margin: 0; padding: 0; list-style: none; border-top: 1px solid var(--line); }
    .artifact-item {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      align-items: center;
      gap: 10px;
      padding: 9px 0;
      border-bottom: 1px solid var(--line);
    }
    .artifact-path { min-width: 0; font: 12px var(--mono); overflow-wrap: anywhere; }
    .artifact-path a { color: var(--text); }
    .artifact-path a:hover { color: var(--teal); }
    .artifact-kind, .artifact-size { color: var(--faint); font: 10px var(--mono); white-space: nowrap; }
    .unavailable { color: var(--ochre); }

    .score-rail { display: grid; grid-template-columns: repeat(5, minmax(120px, 1fr)); gap: 1px; margin-bottom: 14px; border: 1px solid var(--line); background: var(--line); }
    .score-box { min-height: 94px; padding: 12px; background: var(--surface); }
    .score-box .label { color: var(--muted); font: 10px var(--mono); letter-spacing: .08em; text-transform: uppercase; }
    .score-box .value { margin-top: 6px; color: var(--text); font: 21px var(--mono); }
    .score-box .sub { margin-top: 4px; color: var(--faint); font-size: 11px; }
    .score-box .value.pass { color: var(--green); }
    .score-box .value.fail { color: var(--rust); }
    .score-box .value.incomplete { color: var(--ochre); }

    .transcript-tabs { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 10px; }
    .transcript-tab { min-height: 34px; border: 1px solid var(--line); border-radius: 2px; padding: 6px 9px; background: transparent; color: var(--muted); cursor: pointer; font: 11px var(--mono); }
    .transcript-tab.active, .transcript-tab:hover { border-color: var(--teal-dim); background: var(--surface-2); color: var(--text); }
    .transcript-content { border: 1px solid var(--line); background: #111416; padding: 12px; }
    .transcript-content a { display: inline-block; margin-top: 9px; }

    .related-list { display: flex; flex-wrap: wrap; gap: 7px; }
    .related-link { display: inline-flex; flex-direction: column; gap: 2px; border: 1px solid var(--line); padding: 8px 10px; background: var(--surface-2); }
    .related-link .related-id { color: var(--text); font: 11px var(--mono); }
    .related-link .related-meta { color: var(--muted); font-size: 11px; }

    footer { border-top: 1px solid var(--line); padding: 18px 24px 26px; color: var(--faint); text-align: center; font: 11px var(--mono); }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    .loading { padding: 80px 20px; color: var(--muted); text-align: center; }
    .loading::before { content: ""; display: block; width: 22px; height: 22px; margin: 0 auto 12px; border: 2px solid var(--line-strong); border-top-color: var(--teal); border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .loading::before { animation: none; } * { scroll-behavior: auto !important; } }

    @media (max-width: 820px) {
      .header-inner { align-items: flex-start; flex-direction: column; gap: 9px; padding: 12px 16px 0; }
      .main-nav { width: 100%; }
      .nav-link { flex: 1; }
      main { padding: 20px 16px 38px; }
      .view-header, .identity { display: block; }
      .view-actions { justify-content: flex-start; margin-top: 15px; }
      .stats-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .stats-grid .stat:last-child { grid-column: span 2; }
      .two-col, .three-col { grid-template-columns: 1fr; gap: 12px; background: transparent; }
      .three-col > * { border: 1px solid var(--line); }
      .score-rail { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .score-box:last-child { grid-column: span 2; }
      .identity .meta-grid { margin-top: 15px; }
    }
    @media (max-width: 500px) {
      .brand { font-size: 12px; }
      .header-meta { max-width: calc(100vw - 32px); }
      .toolbar { display: grid; grid-template-columns: 1fr 1fr; }
      .toolbar .control, .toolbar .control.wide { grid-column: span 2; }
      .toolbar .control.tight { grid-column: span 1; }
      .toolbar .button { grid-column: span 2; }
      .artifact-item { grid-template-columns: minmax(0, 1fr) auto; }
      .artifact-size { display: none; }
      .notice { display: block; }
      .notice .button { margin: 9px 0 0; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="masthead">
        <a class="brand" href="#/overview" aria-label="Agent Evals overview"><span class="brand-mark" aria-hidden="true"></span>Agent Evals / Archive</a>
        <div class="header-meta" id="headerMeta">loading results bundle…</div>
      </div>
      <nav class="main-nav" aria-label="Primary navigation">
        <a class="nav-link" href="#/overview" data-nav="overview">Monitor</a>
        <a class="nav-link" href="#/overview?mode=compare" data-nav="compare">Compare</a>
      </nav>
    </div>
  </header>

  <main id="app" aria-live="polite">
    <div class="loading">Loading results bundle</div>
  </main>
  <footer>results.json is the published source of truth · missing fields remain missing · no external runtime dependencies</footer>

  <script>
  /*
   * Agent Evals static archive
   *
   * Publication layout: serve the project root (for example, `python -m http.server` in
   * /home/ragiton/projects/agent-evals) and open /site/. The loader also accepts a
   * co-located /site/results.json bundle for deployment to a static host.
   */
  (() => {
    'use strict';

    const app = document.getElementById('app');
    const headerMeta = document.getElementById('headerMeta');
    const runtime = {
      raw: null,
      data: null,
      sourceUrl: '',
      overview: { group: 'eval', sort: 'newest', query: '', eval: '', agent: '', model: '', skill: '' },
      transcriptTab: 'stdout'
    };

    const $ = (selector, root = document) => root.querySelector(selector);
    const $$ = (selector, root = document) => Array.from(root.querySelectorAll(selector));
    const has = (value) => value !== null && value !== undefined && value !== '';
    const arr = (value) => Array.isArray(value) ? value : [];
    const obj = (value) => value && typeof value === 'object' && !Array.isArray(value) ? value : {};
    const text = (value, fallback = '') => has(value) ? String(value) : fallback;
    const lower = (value) => text(value).toLowerCase();
    const clamp = (value, min, max) => Math.min(max, Math.max(min, value));
    const toFiniteNumber = (value) => {
      if (value === null || value === undefined || value === '') return null;
      const number = Number(value);
      return Number.isFinite(number) ? number : null;
    };

    function escapeHtml(value) {
      return text(value).replace(/[&<>"']/g, (character) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[character]);
    }

    function escapeAttr(value) { return escapeHtml(value); }

    function formatDuration(milliseconds) {
      if (!Number.isFinite(milliseconds) || milliseconds < 0) return '—';
      const totalSeconds = Math.round(milliseconds / 1000);
      const seconds = totalSeconds % 60;
      const totalMinutes = Math.floor(totalSeconds / 60);
      const minutes = totalMinutes % 60;
      const hours = Math.floor(totalMinutes / 60);
      if (hours > 0) return `${hours}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
      return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
    }

    function formatCost(value) {
      if (!Number.isFinite(value)) return '<span class="missing" title="Actual cost was not captured">—</span>';
      return `<span class="mono">$${value.toFixed(2)}</span>`;
    }

    function formatScore(value) {
      return Number.isFinite(value) ? value.toFixed(2) : '—';
    }

    function formatThreshold(value) {
      return Number.isFinite(value) ? value.toFixed(2) : '—';
    }

    function formatDate(value, withTime = true) {
      if (!has(value)) return '—';
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return text(value);
      try {
        return new Intl.DateTimeFormat(undefined, {
          dateStyle: withTime ? 'medium' : 'medium',
          timeStyle: withTime ? 'short' : undefined
        }).format(date);
      } catch (_) { return date.toISOString(); }
    }

    function formatBytes(value) {
      if (!Number.isFinite(value) || value < 0) return '—';
      if (value < 1024) return `${value} B`;
      if (value < 1024 * 1024) return `${(value / 1024).toFixed(1)} KiB`;
      if (value < 1024 * 1024 * 1024) return `${(value / (1024 * 1024)).toFixed(1)} MiB`;
      return `${(value / (1024 * 1024 * 1024)).toFixed(1)} GiB`;
    }

    function normalizedStatus(value) {
      const candidate = lower(value).replace(/\s+/g, '_');
      if (['pass', 'passed', 'success', 'succeeded', 'green'].includes(candidate)) return 'pass';
      if (['fail', 'failed', 'failure', 'red'].includes(candidate)) return 'fail';
      if (['running', 'active', 'in_progress'].includes(candidate)) return 'running';
      if (['incomplete', 'ungraded', 'pending', 'timeout', 'timed_out', 'cancelled', 'canceled'].includes(candidate)) return 'incomplete';
      return null;
    }

    function deriveDuration(run) {
      const storedDuration = toFiniteNumber(run.duration_ms);
      if (storedDuration !== null && storedDuration >= 0) return storedDuration;
      if (!has(run.started_at) || !has(run.finished_at)) return null;
      const start = new Date(run.started_at).getTime();
      const finish = new Date(run.finished_at).getTime();
      if (!Number.isFinite(start) || !Number.isFinite(finish) || finish < start) return null;
      return finish - start;
    }

    function deriveStatus(run) {
      const explicit = normalizedStatus(run.status || run.verdict);
      if (explicit) return explicit;
      if (!has(run.finished_at)) return 'running';
      if (Number(run.exit_code) === 124 || lower(run.reason).includes('timeout')) return 'incomplete';
      if (run.passed === true) return 'pass';
      if (run.passed === false) return 'fail';
      return 'incomplete';
    }

    function safeRelativeUrl(value) {
      if (!has(value)) return null;
      const candidate = String(value).trim();
      if (!candidate || candidate.startsWith('/') || candidate.startsWith('\\') || /^[a-z][a-z\d+.-]*:/i.test(candidate)) return null;
      if (candidate.includes('\\') || candidate.includes('\0')) return null;
      const pathParts = candidate.split('/');
      const parentParts = pathParts.filter((part) => part === '..');
      // A published site served from /site/ may use one leading ../ to reach
      // a sibling results/ directory. Anything deeper is path traversal.
      if (parentParts.length > 1 || pathParts.some((part, index) => part === '..' && index !== 0)) return null;
      if (pathParts.some((part) => part === '.')) return null;
      if (/(^|[/\\])(?:\.env|.*auth|.*cookie|.*secret|.*token|\.ssh)(?:[/\\]|$)/i.test(candidate)) return null;
      if (candidate.includes('/home/') || candidate.includes('/.codex/') || candidate.includes('/.cursor/')) return null;
      return candidate.split('/').map((part) => encodeURIComponent(part)).join('/');
    }

    function pageRelativeAssetUrl(value) {
      const safe = safeRelativeUrl(value);
      if (!safe) return null;
      if (safe.startsWith('results/')) return `../${safe}`;
      if (safe.startsWith('site/')) return `../${safe.slice(5)}`;
      return safe;
    }

    function displayPath(value) {
      if (!has(value)) return 'path unavailable';
      const candidate = String(value).replace(/\\/g, '/');
      if (candidate.startsWith('/home/') || candidate.startsWith('/Users/') || candidate.startsWith('C:/')) return '[machine-local path withheld]';
      return candidate;
    }

    function parseMaybeJson(value) {
      if (typeof value !== 'string') return value;
      try { return JSON.parse(value); } catch (_) { return value; }
    }

    function prettyValue(value) {
      if (!has(value)) return '';
      const parsed = parseMaybeJson(value);
      if (typeof parsed === 'string') return parsed;
      try { return JSON.stringify(parsed, null, 2); } catch (_) { return String(parsed); }
    }

    function normalizeRequirementList(value) {
      if (Array.isArray(value)) return value.map((item) => typeof item === 'object' ? item : String(item));
      if (typeof value === 'string' && value.trim()) return value.split(/\n+/).map((item) => item.trim()).filter(Boolean);
      return [];
    }

    function inferRunDir(run) {
      // This only follows the documented run-id directory convention. It never
      // infers a skill, agent, or artifact from a directory name.
      if (/^run-\d+[-a-z0-9]*$/i.test(text(run.run_id))) return `results/runs/${run.run_id}`;
      return null;
    }

    function artifactKind(value) {
      const candidate = lower(value);
      if (['primary', 'deliverable', 'output'].includes(candidate)) return 'primary';
      if (['evidence', 'grader', 'grade'].includes(candidate)) return 'evidence';
      if (['diagnostic', 'diagnostics', 'debug'].includes(candidate)) return 'diagnostic';
      if (['script', 'scripts', 'source'].includes(candidate)) return 'script';
      if (['log', 'logs', 'transcript'].includes(candidate)) return 'log';
      return 'artifact';
    }

    function normalizeArtifacts(run) {
      const explicit = arr(run.artifacts).length ? arr(run.artifacts) : arr(run.captured_files);
      const items = explicit.map((item) => {
        const record = typeof item === 'string' ? { path: item } : obj(item);
        const path = text(record.path || record.relative_path || record.name);
        const url = pageRelativeAssetUrl(record.url || record.href || path);
        return {
          path: displayPath(path), rawPath: path, url,
          label: text(record.label || record.name || path, 'Captured file'),
          kind: artifactKind(record.kind || record.type || inferArtifactKind(path)),
          sizeBytes: toFiniteNumber(record.sizeBytes) ?? toFiniteNumber(record.size_bytes),
          available: record.available !== false
        };
      }).filter((item) => item.path !== 'path unavailable' || item.url);

      const runDir = text(run.run_dir || run.runDir || '');
      const inferred = runDir || inferRunDir(run);
      if (!items.length && inferred) {
        // Legacy 1.0.0 output has no artifact manifest. These conventional files
        // are presented as relative references, never as absolute local paths.
        ['run.json', 'grade.json', 'stdout.txt', 'stderr.txt', 'cross_grade_codex.txt'].forEach((name) => {
          const path = `${inferred}/${name}`;
          items.push({ path, rawPath: path, url: pageRelativeAssetUrl(path), label: name, kind: inferArtifactKind(name), sizeBytes: null, available: true, inferred: true });
        });
      }
      return items;
    }

    function inferArtifactKind(path) {
      const candidate = lower(path);
      const filename = candidate.split('/').pop() || '';
      if (filename.startsWith('_') || candidate.includes('/__pycache__/')) return 'diagnostic';
      if (candidate.includes('stdout') || candidate.includes('stderr') || candidate.includes('log') || candidate.includes('cross_grade')) return 'log';
      if (candidate.endsWith('.rpt') || candidate.endsWith('.json') && (candidate.includes('erc') || candidate.includes('drc') || candidate.includes('grade'))) return 'evidence';
      if (candidate.endsWith('.py') || candidate.endsWith('.sh')) return 'script';
      if (candidate.includes('/workspace/')) return 'primary';
      return 'artifact';
    }

    function normalizeTranscript(run) {
      const transcript = run.transcript;
      if (typeof transcript === 'string') return { stdout: transcript, stderr: '', stdoutUrl: null, stderrUrl: null };
      const record = obj(transcript);
      const stdout = has(record.stdout) ? record.stdout : (has(run.stdout) ? run.stdout : '');
      const stderr = has(record.stderr) ? record.stderr : (has(run.stderr) ? run.stderr : '');
      const runDir = text(run.run_dir || run.runDir) || inferRunDir(run);
      const stdoutUrl = pageRelativeAssetUrl(record.stdout_url || record.stdoutUrl || (runDir ? `${runDir}/stdout.txt` : null));
      const stderrUrl = pageRelativeAssetUrl(record.stderr_url || record.stderrUrl || (runDir ? `${runDir}/stderr.txt` : null));
      if (stdout || stderr || stdoutUrl || stderrUrl) return { stdout, stderr, stdoutUrl, stderrUrl };
      return null;
    }

    // Legacy 1.0.0 runs do not carry an artifact manifest. When the published
    // server exposes directory indexes (python -m http.server does), discover
    // those files as an additive fallback. A static host without indexes still
    // gets the conventional links from normalizeArtifacts above.
    async function discoverDirectory(directory, depth = 0, visited = new Set()) {
      if (depth > 2) return [];
      const directoryUrl = pageRelativeAssetUrl(`${directory}/`);
      if (!directoryUrl || visited.has(directoryUrl)) return [];
      visited.add(directoryUrl);
      try {
        const response = await fetch(directoryUrl, { cache: 'no-store' });
        if (!response.ok) return [];
        const html = await response.text();
        const documentFragment = new DOMParser().parseFromString(html, 'text/html');
        const found = [];
        for (const anchor of Array.from(documentFragment.querySelectorAll('a[href]'))) {
          const href = String(anchor.getAttribute('href') || '').trim();
          if (!href || href.startsWith('#') || href.startsWith('?') || href.startsWith('/') || /^[a-z][a-z\d+.-]*:/i.test(href)) continue;
          const hrefPath = href.split(/[?#]/, 1)[0];
          if (!hrefPath) continue;
          let decoded;
          try { decoded = decodeURIComponent(hrefPath); } catch (_) { continue; }
          if (!decoded || decoded.includes('\\') || decoded.split('/').some((part) => part === '..')) continue;
          const isDirectory = decoded.endsWith('/');
          const name = decoded.replace(/\/+$/, '');
          if (!name) continue;
          const path = `${directory}/${name}`;
          if (isDirectory) {
            found.push(...await discoverDirectory(path, depth + 1, visited));
            continue;
          }
          const url = pageRelativeAssetUrl(path);
          if (!url) continue;
          found.push({ path: displayPath(path), rawPath: path, url, label: name.split('/').pop(), kind: inferArtifactKind(path), sizeBytes: null, available: true, discovered: true });
        }
        return found;
      } catch (_) {
        return [];
      }
    }

    async function discoverLegacyArtifacts(data) {
      for (const run of data.runs) {
        const raw = obj(run.raw);
        if (arr(raw.artifacts).length || arr(raw.captured_files).length) continue;
        const runDir = text(run.runDir) || inferRunDir(raw);
        if (!runDir) continue;
        const discovered = await discoverDirectory(runDir);
        if (!discovered.length) continue;
        const known = new Set(run.artifacts.map((artifact) => artifact.rawPath));
        run.artifacts.push(...discovered.filter((artifact) => !known.has(artifact.rawPath)));
      }
    }

    function normalizeEval(record) {
      const grading = obj(record.grading);
      const specification = obj(record.specification || record.spec);
      const estimatedMinutes = toFiniteNumber(record.estimated_minutes ?? record.estimatedMinutes);
      const specificationThreshold = specification.passing_threshold ?? specification.passingThreshold ?? record.passing_threshold;
      const gradingThreshold = grading.passing_threshold ?? grading.passingThreshold ?? record.passing_threshold;
      return {
        id: text(record.id, 'unknown-eval'),
        title: text(record.title || record.name, text(record.id, 'Untitled eval')),
        description: text(record.description),
        difficulty: record.difficulty,
        estimatedMinutes,
        category: text(record.category),
        specification: {
          version: specification.version ?? record.version ?? null,
          functionalRequirements: normalizeRequirementList(specification.functional_requirements || specification.functionalRequirements || record.functional_requirements),
          engineeringRequirements: normalizeRequirementList(specification.engineering_requirements || specification.engineeringRequirements || record.engineering_requirements),
          prompt: text(specification.prompt || record.prompt),
          inputs: specification.inputs ?? record.inputs ?? null,
          outputs: specification.outputs ?? record.outputs ?? null,
          passingThreshold: toFiniteNumber(specificationThreshold),
          metadata: specification.metadata || record.metadata || null,
          sourcePath: text(specification.source_path || specification.sourcePath || record.source_path)
        },
        grading: {
          deterministic: arr(grading.deterministic),
          llmJudge: obj(grading.llm_judge || grading.llmJudge),
          weights: obj(grading.weights),
          passingThreshold: toFiniteNumber(gradingThreshold)
        }
      };
    }

    function normalizeImages(record) {
      const explicit = arr(record.images);
      if (explicit.length) {
        return explicit.map((item) => {
          const obj2 = typeof item === 'string' ? { path: item } : item;
          const path = text(obj2.path);
          return {
            path,
            label: text(obj2.label || obj2.name || path),
            url: text(obj2.url || path),
            alt: text(obj2.alt || obj2.label || path)
          };
        }).filter((item) => item.path);
      }
      // Convention: discover images under /docs/artifacts/<run-id>-*.png
      // The published site lives under /agent-evals/ so URLs are relative to /docs/.
      const runId = text(record.run_id || record.runId);
      if (!runId) return [];
      const base = '../artifacts/';
      const candidates = [
        { path: `${runId}-top.png`, label: 'PCB top view', alt: `${runId} PCB top view` },
        { path: `${runId}-iso.png`, label: 'PCB isometric', alt: `${runId} PCB isometric` }
      ];
      return candidates.map((item) => ({ ...item, url: `${base}${item.path}` }));
    }

    function normalizeRun(record, index) {
      const usage = obj(record.usage);
      const score = toFiniteNumber(record.final_score);
      const deterministicScore = toFiniteNumber(record.deterministic_score);
      const cost = toFiniteNumber(has(record.cost_usd) ? record.cost_usd : usage.cost_usd);
      return {
        raw: record,
        index,
        runId: text(record.run_id || record.id, `run-${index + 1}`),
        evalId: text(record.spec_id || record.eval_id, 'unknown-eval'),
        agent: text(record.agent, 'unknown agent'),
        model: text(record.model),
        skill: has(record.skill) ? String(record.skill) : (has(obj(record.metadata).skill) ? String(obj(record.metadata).skill) : null),
        startedAt: record.started_at || record.startedAt || null,
        finishedAt: record.finished_at || record.finishedAt || null,
        gradedAt: record.graded_at || record.gradedAt || null,
        durationMs: deriveDuration(record),
        exitCode: has(record.exit_code) ? Number(record.exit_code) : null,
        status: deriveStatus(record),
        verdict: text(record.verdict),
        passed: record.passed === true ? true : (record.passed === false ? false : null),
        finalScore: score,
        deterministicScore,
        deterministic: arr(record.deterministic),
        llmJudge: record.llm_judge ?? record.llmJudge ?? null,
        crossGrades: arr(record.cross_grades || record.crossGrades),
        costUsd: cost,
        usage,
        costCap: toFiniteNumber(record.max_budget_usd),
        runDir: text(record.run_dir || record.runDir),
        workspace: text(record.workspace),
        notes: text(record.notes || record.reason),
        artifacts: normalizeArtifacts(record),
        transcript: normalizeTranscript(record),
        toolCalls: Array.isArray(record.tool_calls) ? record.tool_calls : (Array.isArray(record.toolCalls) ? record.toolCalls : null),
        capturedFiles: arr(record.captured_files || record.capturedFiles),
        images: normalizeImages(record)
      };
    }

    function normalizeDocument(raw, sourceUrl) {
      const evals = arr(raw.evals).map(normalizeEval);
      const runs = arr(raw.runs).map(normalizeRun);
      const evalById = new Map(evals.map((item) => [item.id, item]));
      return {
        meta: { generatedAt: raw.generated_at || raw.generatedAt || null, schemaVersion: text(raw.schema_version || raw.schemaVersion, 'unknown'), sourceUrl },
        evals, runs, evalById
      };
    }

    async function loadResults() {
      const candidates = ['./results.json', '../results/results.json', '/results/results.json'];
      const errors = [];
      for (const candidate of candidates) {
        try {
          const response = await fetch(candidate, { cache: 'no-store' });
          if (!response.ok) { errors.push(`${candidate} → HTTP ${response.status}`); continue; }
          const json = await response.json();
          if (!json || typeof json !== 'object') throw new Error('JSON root is not an object');
          return { raw: json, sourceUrl: new URL(candidate, location.href).href };
        } catch (error) { errors.push(`${candidate} → ${error.message}`); }
      }
      throw new Error(`Could not load results.json. ${errors.join(' · ')}`);
    }

    function statusLabel(status) { return ({ pass: 'pass', fail: 'fail', incomplete: 'incomplete', running: 'running', unknown: 'unknown' })[status] || 'unknown'; }
    function statusMarkup(status, label = statusLabel(status)) { return `<span class="status ${escapeAttr(status || 'unknown')}">${escapeHtml(label)}</span>`; }
    function chipMarkup(label, tone = '') { return `<span class="chip ${tone}">${escapeHtml(label)}</span>`; }
    function missingMarkup(label = '—') { return `<span class="missing" title="This field was not captured">${escapeHtml(label)}</span>`; }

    function evalForRun(run) { return runtime.data.evalById.get(run.evalId) || null; }
    function thresholdFor(evalRecord) {
      if (!evalRecord) return null;
      return Number.isFinite(evalRecord.specification.passingThreshold) ? evalRecord.specification.passingThreshold : evalRecord.grading.passingThreshold;
    }
    function runTimestamp(run) {
      if (!run) return 0;
      const date = new Date(run.finishedAt || run.startedAt || run.gradedAt || 0).getTime();
      return Number.isFinite(date) ? date : 0;
    }
    function labelSkill(skill) { return has(skill) ? skill : 'unattributed'; }
    function statusCounts(runs) {
      return runs.reduce((counts, run) => { counts[run.status] = (counts[run.status] || 0) + 1; return counts; }, { pass: 0, fail: 0, incomplete: 0, running: 0 });
    }

    function bestCompleted(runs) {
      return runs.filter((run) => (run.status === 'pass' || run.status === 'fail') && Number.isFinite(run.finalScore)).sort((a, b) => (b.finalScore - a.finalScore) || (runTimestamp(b) - runTimestamp(a)))[0] || null;
    }

    function latestRun(runs) { return runs.slice().sort((a, b) => (runTimestamp(b) - runTimestamp(a)) || (b.index - a.index))[0] || null; }

    function groupRuns(data, groupBy) {
      // Keep the default monitor at eval × agent × skill granularity so one
      // agent's passing attempt cannot hide another agent's incomplete run.
      // The selected dimension becomes the leading label; the other dimensions
      // remain visible in the row and are still available as filters.
      const grouped = new Map();
      const keyFor = (evalId, agent, skill) => {
        const dimensions = { eval: [evalId, agent, skill], agent: [agent, evalId, skill], skill: [skill, evalId, agent] };
        return JSON.stringify(dimensions[groupBy] || dimensions.eval);
      };
      const labelFor = (groupBy, evalId, agent, skill, empty = false) => {
        if (empty) return groupBy === 'agent' ? 'no runs' : 'unattributed';
        return groupBy === 'eval' ? (data.evalById.get(evalId)?.title || 'Unknown eval') : groupBy === 'agent' ? agent : skill;
      };
      const addRun = (run) => {
        const skill = labelSkill(run.skill);
        const key = keyFor(run.evalId, run.agent, skill);
        if (!grouped.has(key)) grouped.set(key, { label: labelFor(groupBy, run.evalId, run.agent, skill), evalId: run.evalId, runs: [] });
        grouped.get(key).runs.push(run);
      };
      data.runs.forEach(addRun);

      // Retain every catalog definition in the monitor, including evals with
      // no attempts. Orphaned runs stay visible under an Unknown eval row.
      data.evals.forEach((evalRecord) => {
        if (!Array.from(grouped.values()).some((entry) => entry.evalId === evalRecord.id)) {
          const skill = 'unattributed';
          const agent = 'no runs';
          const key = keyFor(evalRecord.id, agent, skill);
          grouped.set(key, { label: labelFor(groupBy, evalRecord.id, agent, skill, true), evalId: evalRecord.id, runs: [] });
        }
      });
      const orphans = data.runs.filter((run) => !data.evalById.has(run.evalId));
      if (orphans.length && !Array.from(grouped.values()).some((entry) => entry.evalId === 'unknown-eval')) {
        const skill = 'unattributed';
        const agent = 'unknown agent';
        const key = keyFor('unknown-eval', agent, skill);
        grouped.set(key, { label: labelFor(groupBy, 'unknown-eval', agent, skill), evalId: 'unknown-eval', runs: orphans });
      }
      return Array.from(grouped.values()).map((entry) => makeGroup(`${entry.label}|${entry.evalId}`, entry.label, entry.runs, data.evalById.get(entry.evalId) || null, groupBy));
    }

    function makeGroup(key, groupLabel, runs, evalRecord, groupBy = 'eval') {
      const best = bestCompleted(runs);
      const latest = latestRun(runs);
      const representatives = best || latest;
      const scores = runs.filter((run) => Number.isFinite(run.finalScore));
      const avgScore = scores.length ? scores.reduce((sum, run) => sum + run.finalScore, 0) / scores.length : null;
      const durationRuns = runs.filter((run) => Number.isFinite(run.durationMs));
      const avgDuration = durationRuns.length ? durationRuns.reduce((sum, run) => sum + run.durationMs, 0) / durationRuns.length : null;
      return {
        key, groupLabel, groupBy, eval: evalRecord, evalId: evalRecord ? evalRecord.id : (runs[0] ? runs[0].evalId : 'unknown-eval'), runs,
        best, latest, representative: representatives, avgScore, avgDuration,
        agents: Array.from(new Set(runs.map((run) => run.agent))).sort(),
        skills: Array.from(new Set(runs.map((run) => labelSkill(run.skill)))).sort(),
        latestCost: latest ? latest.costUsd : null,
        count: runs.length
      };
    }

    function matchesOverview(group) {
      const filters = runtime.overview;
      const values = [group.eval ? group.eval.id : group.evalId, group.eval ? group.eval.title : '', ...group.runs.flatMap((run) => [run.agent, run.model, labelSkill(run.skill)])].map(lower).join(' ');
      if (filters.query && !values.includes(lower(filters.query))) return false;
      if (filters.eval && group.evalId !== filters.eval) return false;
      if (filters.agent && !group.runs.some((run) => run.agent === filters.agent)) return false;
      if (filters.model && !group.runs.some((run) => run.model === filters.model)) return false;
      if (filters.skill && !group.runs.some((run) => labelSkill(run.skill) === filters.skill)) return false;
      return true;
    }

    function compareGroups(a, b) {
      const sort = runtime.overview.sort;
      if (sort === 'score') return (b.best ? b.best.finalScore : -1) - (a.best ? a.best.finalScore : -1) || a.key.localeCompare(b.key);
      if (sort === 'pass_rate') {
        const rate = (group) => group.runs.length ? group.runs.filter((run) => run.status === 'pass').length / group.runs.length : -1;
        return rate(b) - rate(a) || a.key.localeCompare(b.key);
      }
      if (sort === 'duration') return (a.avgDuration ?? Infinity) - (b.avgDuration ?? Infinity) || a.key.localeCompare(b.key);
      if (sort === 'cost') return (a.latestCost ?? Infinity) - (b.latestCost ?? Infinity) || a.key.localeCompare(b.key);
      return runTimestamp(b.latest) - runTimestamp(a.latest) || a.key.localeCompare(b.key);
    }

    function renderStats(data) {
      const counts = statusCounts(data.runs);
      const agents = new Set(data.runs.map((run) => run.agent));
      const actualCosts = data.runs.map((run) => run.costUsd).filter(Number.isFinite);
      const totalCost = actualCosts.length ? actualCosts.reduce((sum, value) => sum + value, 0) : null;
      return `<div class="stats-grid">
        <div class="stat"><div class="stat-label">Eval catalog</div><div class="stat-value">${data.evals.length}</div><div class="stat-note">definitions, including empty evals</div></div>
        <div class="stat"><div class="stat-label">Runs captured</div><div class="stat-value">${data.runs.length}</div><div class="stat-note">${agents.size} agent${agents.size === 1 ? '' : 's'} represented</div></div>
        <div class="stat"><div class="stat-label">Pass</div><div class="stat-value pass">${counts.pass}</div><div class="stat-note">explicitly evaluated pass</div></div>
        <div class="stat"><div class="stat-label">Fail</div><div class="stat-value fail">${counts.fail}</div><div class="stat-note">explicitly evaluated fail</div></div>
        <div class="stat"><div class="stat-label">Incomplete / running</div><div class="stat-value incomplete">${counts.incomplete + counts.running}</div><div class="stat-note">actual spend: ${totalCost === null ? 'not captured' : '$' + totalCost.toFixed(2)}</div></div>
      </div>`;
    }

    function renderFilterOptions(data, field, selected) {
      const values = field === 'eval' ? data.evals.map((item) => ({ value: item.id, label: item.title })) : Array.from(new Set(data.runs.map((run) => field === 'skill' ? labelSkill(run.skill) : run[field]))).filter(has).sort().map((value) => ({ value, label: value }));
      return `<option value="">all ${escapeHtml(field)}s</option>${values.map((item) => `<option value="${escapeAttr(item.value)}"${item.value === selected ? ' selected' : ''}>${escapeHtml(item.label)}</option>`).join('')}`;
    }

    function renderCompare(data) {
      const lanes = [...new Set(data.runs.map((run) => `${run.agent} · ${run.model || '—'}`))].sort();
      const cells = data.evals.map((evalRecord) => {
        const runs = data.runs.filter((run) => run.evalId === evalRecord.id);
        const laneCells = lanes.map((lane) => {
          const laneRuns = runs.filter((run) => `${run.agent} · ${run.model || '—'}` === lane);
          if (!laneRuns.length) return '<td class="muted-cell">—</td>';
          const completed = laneRuns.filter((run) => run.finalScore !== null).sort((a, b) => (b.finalScore ?? -1) - (a.finalScore ?? -1));
          const latest = [...laneRuns].sort((a, b) => String(b.startedAt || '').localeCompare(String(a.startedAt || '')))[0];
          const representative = completed[0] || latest;
          const score = completed.length ? formatScore(completed[0].finalScore) : '—';
          return `<td><a class="compare-cell" href="#/run/${encodeURIComponent(representative.runId)}"><span>${statusMarkup(latest.status)}</span><strong>${score}</strong><small>${laneRuns.length} attempt${laneRuns.length === 1 ? '' : 's'}</small></a></td>`;
        }).join('');
        return `<tr><th scope="row"><a href="#/eval/${encodeURIComponent(evalRecord.id)}">${escapeHtml(evalRecord.title)}</a><small>${escapeHtml(evalRecord.id)}</small></th>${laneCells}</tr>`;
      }).join('');
      return `<section aria-labelledby="compare-title">
        <div class="view-header"><div><p class="eyebrow">Compare / agent lanes</p><h1 id="compare-title">Cross-agent comparison</h1><p class="lede">Each cell shows the latest status and best completed score for an agent/model lane. Empty cells are preserved; incomplete runs never become zero.</p></div><div class="view-actions"><a class="button primary" href="#/overview">← monitor</a></div></div>
        <div class="panel"><div class="panel-heading"><h2>Eval × agent matrix</h2><span class="hint">${data.evals.length} evals · ${lanes.length} lanes</span></div><div class="panel-body"><div class="table-wrap"><table><thead><tr><th scope="col">eval</th>${lanes.map((lane) => `<th scope="col">${escapeHtml(lane)}</th>`).join('')}</tr></thead><tbody>${cells || '<tr><td colspan="2">No eval definitions captured.</td></tr>'}</tbody></table></div></div></div>
      </section>`;
    }

    function renderOverview(data) {
      const groups = groupRuns(data, runtime.overview.group).filter(matchesOverview).sort(compareGroups);
      const hasRuns = data.runs.length > 0;
      const rows = groups.map((group) => {
        const evalRecord = group.eval;
        const best = group.best;
        const latest = group.latest;
        const representative = group.representative;
        const threshold = thresholdFor(evalRecord);
        const status = latest ? latest.status : 'incomplete';
        const groupLabel = group.groupBy === 'eval' ? (evalRecord ? evalRecord.title : 'Unknown eval') : group.groupLabel;
        const subLabel = group.groupBy === 'eval' ? group.evalId : (evalRecord ? evalRecord.title : group.evalId);
        const agentText = group.agents.length ? group.agents.join(', ') : '—';
        const skillText = group.skills.length ? group.skills.join(', ') : 'unattributed';
        return `<tr>
          <td><div class="cell-stack"><a class="row-title" href="#/eval/${encodeURIComponent(group.evalId)}">${escapeHtml(groupLabel)}</a><span class="row-subtitle mono">${escapeHtml(subLabel)}</span></div></td>
          <td><div class="cell-stack"><span>${escapeHtml(agentText)}</span><span class="row-subtitle">${group.runs.length ? escapeHtml(group.runs.map((run) => run.model).filter(Boolean).filter((value, index, list) => list.indexOf(value) === index).join(', ') || 'model unavailable') : 'no runs yet'}</span></div></td>
          <td><div class="chip-list">${group.skills.map((skill) => chipMarkup(skill, skill === 'unattributed' ? 'ochre' : 'teal')).join('') || chipMarkup('unattributed', 'ochre')}</div></td>
          <td>${statusMarkup(status, latest ? `${statusLabel(status)}${best && latest.runId !== best.runId ? ' · latest' : ''}` : 'no runs')}</td>
          <td><div class="cell-stack"><span class="score ${best ? '' : 'muted'}">${best ? formatScore(best.finalScore) : '—'}</span><span class="row-subtitle">${best ? 'best completed' : 'no completed score'}</span></div></td>
          <td class="threshold">${formatThreshold(threshold)}</td>
          <td class="mono">${group.avgDuration === null ? '—' : formatDuration(group.avgDuration)}</td>
          <td>${latest ? formatCost(latest.costUsd) : missingMarkup()}</td>
          <td><div class="cell-stack"><span class="mono">${group.count}</span>${latest ? `<a class="row-subtitle" href="#/run/${encodeURIComponent(latest.runId)}">latest ↗</a>` : '<span class="row-subtitle">no run link</span>'}</div></td>
          <td>${representative ? `<a class="button ghost" href="#/run/${encodeURIComponent(representative.runId)}">open run</a>` : '<span class="missing">—</span>'}</td>
        </tr>`;
      }).join('');
      const emptyMessage = !hasRuns ? `<div class="empty-state"><strong>No runs captured yet</strong><p>The eval catalog is still available. Run an eval and regenerate <code>results.json</code> to populate this monitor.</p></div>` : `<div class="empty-state"><strong>No rows match these filters</strong><p>Clear one or more filters to return to the full archive index.</p></div>`;
      return `<section aria-labelledby="overview-title">
        <div class="view-header"><div><p class="eyebrow">Monitor / archive index</p><h1 id="overview-title">Engineering agent results</h1><p class="lede">A dense record of eval definitions, attempts, verdicts, timings, and captured evidence. Best completed scores are shown without hiding the latest attempt.</p></div><div class="view-actions"><a class="button primary" href="#/overview">Reset monitor</a></div></div>
        ${renderStats(data)}
        <div class="toolbar" aria-label="Overview filters">
          <label class="control-label control tight">Group by<select class="select" data-control="group"><option value="eval"${runtime.overview.group === 'eval' ? ' selected' : ''}>eval</option><option value="agent"${runtime.overview.group === 'agent' ? ' selected' : ''}>agent</option><option value="skill"${runtime.overview.group === 'skill' ? ' selected' : ''}>skill</option></select></label>
          <label class="control-label control tight">Sort<select class="select" data-control="sort"><option value="newest"${runtime.overview.sort === 'newest' ? ' selected' : ''}>newest</option><option value="score"${runtime.overview.sort === 'score' ? ' selected' : ''}>best score</option><option value="pass_rate"${runtime.overview.sort === 'pass_rate' ? ' selected' : ''}>pass rate</option><option value="duration"${runtime.overview.sort === 'duration' ? ' selected' : ''}>duration</option><option value="cost"${runtime.overview.sort === 'cost' ? ' selected' : ''}>actual cost</option></select></label>
          <label class="control-label control wide">Search<input class="input" data-control="query" type="search" value="${escapeAttr(runtime.overview.query)}" placeholder="id, title, agent, model, or skill"></label>
          <label class="control-label control">Eval<select class="select" data-control="eval">${renderFilterOptions(data, 'eval', runtime.overview.eval)}</select></label>
          <label class="control-label control">Agent<select class="select" data-control="agent">${renderFilterOptions(data, 'agent', runtime.overview.agent)}</select></label>
          <label class="control-label control">Model<select class="select" data-control="model">${renderFilterOptions(data, 'model', runtime.overview.model)}</select></label>
          <label class="control-label control">Skill<select class="select" data-control="skill">${renderFilterOptions(data, 'skill', runtime.overview.skill)}</select></label>
          <button class="button ghost" type="button" data-action="clear-filters">clear filters</button>
          <div class="toolbar-note">Grouping: <span class="mono">${escapeHtml(runtime.overview.group)}</span> · score uses the best completed attempt; status badge is the latest attempt · actual cost is shown only when usage data exists.</div>
        </div>
        <div class="section-title"><h2>Leaderboard grid</h2><span class="count">${groups.length} visible row${groups.length === 1 ? '' : 's'}</span></div>
        ${groups.length ? `<div class="table-wrap"><table><thead><tr><th scope="col">${escapeHtml(runtime.overview.group)} / eval</th><th scope="col">agent / model</th><th scope="col">skill</th><th scope="col">latest status</th><th scope="col">best score</th><th scope="col">threshold</th><th scope="col">avg time</th><th scope="col">latest cost</th><th scope="col">attempts</th><th scope="col">representative</th></tr></thead><tbody>${rows}</tbody></table></div>` : emptyMessage}
      </section>`;
    }

    function specificationNote() { return `<p class="not-included"><strong>Not included in results.json.</strong> This legacy aggregate has no enriched specification manifest for this field. The available description and grading contract are shown elsewhere on this page; no requirements are inferred.</p>`; }

    function renderValueBlock(value, options = {}) {
      if (!has(value) && !(Array.isArray(value) && value.length)) return specificationNote();
      if (Array.isArray(value)) return `<ul>${value.map((item) => `<li>${escapeHtml(typeof item === 'object' ? prettyValue(item) : item)}</li>`).join('')}</ul>`;
      if (typeof value === 'object') return `<pre>${escapeHtml(prettyValue(value))}</pre>`;
      return options.code ? `<pre>${escapeHtml(value)}</pre>` : `<p>${escapeHtml(value)}</p>`;
    }

    function renderRequirements(title, values) {
      if (!values.length) return `<div class="subpanel"><h3>${escapeHtml(title)}</h3><div class="subpanel-body">${specificationNote()}</div></div>`;
      return `<div class="subpanel"><h3>${escapeHtml(title)}</h3><div class="subpanel-body"><ul>${values.map((item) => `<li>${escapeHtml(typeof item === 'object' ? prettyValue(item) : item)}</li>`).join('')}</ul></div></div>`;
    }

    function renderGradingContract(evalRecord) {
      const grading = evalRecord.grading;
      const checks = grading.deterministic;
      const judge = grading.llmJudge;
      return `<div class="panel"><div class="panel-heading"><h2>Grading contract</h2><span class="hint">deterministic checks and judge policy</span></div><div class="panel-body">
        <div class="two-col">
          <div class="subpanel"><h3>Deterministic checks <span class="mono">${checks.length}</span></h3><div class="subpanel-body">${checks.length ? `<ul class="check-list">${checks.map((check) => `<li class="check-item"><div class="check-main"><span class="check-icon pending">·</span><span class="check-name mono">${escapeHtml(check.name || check.id || 'unnamed check')}</span></div><div class="row-subtitle">${escapeHtml(check.command || check.check || 'check expression not captured')}</div><div class="row-subtitle">pass when: <span class="mono">${escapeHtml(check.pass || 'not specified')}</span></div></li>`).join('')}</ul>` : '<p class="not-included">No deterministic checks were captured.</p>'}</div></div>
          <div class="subpanel"><h3>LLM judge</h3><div class="subpanel-body">${has(judge.model) || has(judge.prompt) || has(judge.enabled) ? `<dl class="meta-grid"><div class="meta-item"><dt>enabled</dt><dd>${has(judge.enabled) ? escapeHtml(String(judge.enabled)) : '—'}</dd></div><div class="meta-item"><dt>model</dt><dd class="mono">${escapeHtml(judge.model || '—')}</dd></div></dl>${judge.prompt ? `<div class="evidence-label">prompt</div><pre>${escapeHtml(judge.prompt)}</pre>` : ''}` : specificationNote()}</div></div>
        </div>
        <div class="meta-grid"><div class="meta-item"><dt>passing threshold</dt><dd class="mono">${formatThreshold(thresholdFor(evalRecord))}</dd></div><div class="meta-item"><dt>weights</dt><dd class="mono">${Object.keys(grading.weights).length ? escapeHtml(prettyValue(grading.weights)) : '—'}</dd></div><div class="meta-item"><dt>schema</dt><dd class="mono">${escapeHtml(runtime.data.meta.schemaVersion)}</dd></div></div>
      </div></div>`;
    }

    function renderEvalRunTable(runs) {
      if (!runs.length) return `<div class="empty-state"><strong>No runs yet</strong><p>This eval is defined in the catalog but has no captured attempts.</p></div>`;
      const rows = runs.slice().sort((a, b) => runTimestamp(b) - runTimestamp(a)).map((run) => {
        const evalRecord = evalForRun(run);
        return `<tr><td><a class="run-link" href="#/run/${encodeURIComponent(run.runId)}">${escapeHtml(run.runId)}</a></td><td>${statusMarkup(run.status)}</td><td>${escapeHtml(run.agent)}<div class="row-subtitle">${escapeHtml(run.model || 'model unavailable')}</div></td><td>${chipMarkup(labelSkill(run.skill), run.skill ? 'teal' : 'ochre')}</td><td class="score">${formatScore(run.finalScore)}</td><td class="mono">${formatDuration(run.durationMs)}</td><td>${formatCost(run.costUsd)}</td><td class="time"><div>${escapeHtml(formatDate(run.startedAt))}</div><div>exit ${run.exitCode === null ? '—' : escapeHtml(String(run.exitCode))}</div></td><td><a class="button ghost" href="#/run/${encodeURIComponent(run.runId)}">inspect</a></td></tr>`;
      }).join('');
      return `<div class="table-wrap"><table class="run-table"><thead><tr><th>run</th><th>status</th><th>agent / model</th><th>skill</th><th>score</th><th>duration</th><th>actual cost</th><th>started / exit</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`;
    }

    function renderArtifactIndex(runs) {
      if (!runs.length) return `<div class="empty-state"><strong>No captured files</strong><p>Artifacts will appear here when the aggregator emits an artifact manifest or a published run directory is available.</p></div>`;
      const groups = runs.map((run) => `<div class="artifact-group"><h3><a href="#/run/${encodeURIComponent(run.runId)}">${escapeHtml(run.runId)}</a> <span class="mono">· ${run.artifacts.length}</span></h3>${renderArtifacts(run.artifacts, true)}</div>`).join('');
      return `<div class="artifact-groups">${groups}</div>`;
    }

    function renderEvalDetail(evalRecord) {
      const runs = runtime.data.runs.filter((run) => run.evalId === evalRecord.id);
      const spec = evalRecord.specification;
      const description = evalRecord.description || 'No description was captured.';
      return `<section aria-labelledby="eval-title">
        <div class="breadcrumb"><a href="#/overview">Monitor</a><span class="sep">/</span><span>Eval detail</span><span class="sep">/</span><span>${escapeHtml(evalRecord.id)}</span></div>
        <div class="identity"><div><p class="eyebrow">Eval specification</p><h1 id="eval-title">${escapeHtml(evalRecord.title)}</h1><div class="identity-id">${escapeHtml(evalRecord.id)}</div><p class="identity-description">${escapeHtml(description)}</p></div><div class="view-actions"><a class="button primary" href="#/overview">← all evals</a></div></div>
        <dl class="meta-grid"><div class="meta-item"><dt>category</dt><dd>${escapeHtml(evalRecord.category || '—')}</dd></div><div class="meta-item"><dt>difficulty</dt><dd>${has(evalRecord.difficulty) ? escapeHtml(String(evalRecord.difficulty)) : '—'}</dd></div><div class="meta-item"><dt>estimated time</dt><dd>${evalRecord.estimatedMinutes === null ? '—' : `${evalRecord.estimatedMinutes} min`}</dd></div><div class="meta-item"><dt>runs</dt><dd class="mono">${runs.length}</dd></div><div class="meta-item"><dt>passing threshold</dt><dd class="mono">${formatThreshold(thresholdFor(evalRecord))}</dd></div></dl>
        <div class="panel"><div class="panel-heading"><h2>Specification</h2><span class="hint">fields are rendered only when present</span></div><div class="panel-body">
          <div class="two-col">${renderRequirements('Functional requirements', spec.functionalRequirements)}${renderRequirements('Engineering requirements', spec.engineeringRequirements)}</div>
          <div class="two-col" style="margin-top:14px"><div class="subpanel"><h3>Agent prompt</h3><div class="subpanel-body">${renderValueBlock(spec.prompt, { code: true })}</div></div><div class="subpanel"><h3>Inputs / outputs</h3><div class="subpanel-body"><div class="evidence-label">inputs</div>${renderValueBlock(spec.inputs)}<div class="evidence-label" style="margin-top:13px">outputs</div>${renderValueBlock(spec.outputs)}</div></div></div>
          <div class="meta-grid"><div class="meta-item"><dt>spec version</dt><dd class="mono">${escapeHtml(spec.version || '—')}</dd></div><div class="meta-item"><dt>source path</dt><dd class="mono">${escapeHtml(spec.sourcePath || '—')}</dd></div><div class="meta-item"><dt>metadata</dt><dd>${spec.metadata ? `<pre>${escapeHtml(prettyValue(spec.metadata))}</pre>` : '—'}</dd></div></div>
        </div></div>
        ${renderGradingContract(evalRecord)}
        <div class="panel"><div class="panel-heading"><h2>Run history</h2><span class="hint">newest first · select a run for evidence</span></div><div class="panel-body">${renderEvalRunTable(runs)}</div></div>
        <div class="panel"><div class="panel-heading"><h2>Artifact index</h2><span class="hint">grouped by run · relative published links only</span></div><div class="panel-body">${renderArtifactIndex(runs)}</div></div>
        <div class="panel"><div class="panel-heading"><h2>Grader breakdown</h2><span class="hint">all attempts for this eval</span></div><div class="panel-body">${runs.length ? runs.map((run) => renderRunBreakdown(run, true)).join('') : '<div class="empty-state"><strong>No grader results yet</strong><p>There are no run checks to display.</p></div>'}</div></div>
      </section>`;
    }

    function renderCheck(check) {
      const state = check.pass === true ? 'pass' : check.pass === false ? 'fail' : 'pending';
      const icon = check.pass === true ? '✓' : check.pass === false ? '×' : '·';
      const evidence = [
        has(check.stdout) ? `<div><div class="evidence-label">stdout</div><pre>${escapeHtml(prettyValue(check.stdout))}</pre></div>` : '',
        has(check.stderr) ? `<div><div class="evidence-label">stderr</div><pre>${escapeHtml(prettyValue(check.stderr))}</pre></div>` : '',
        has(check.reason) ? `<div><div class="evidence-label">reason</div><pre>${escapeHtml(prettyValue(check.reason))}</pre></div>` : '',
        has(check.exit_code) ? `<div class="row-subtitle">exit code: <span class="mono">${escapeHtml(String(check.exit_code))}</span></div>` : ''
      ].filter(Boolean).join('');
      return `<li class="check-item"><div class="check-main"><span class="check-icon ${state}">${icon}</span><span class="check-name mono">${escapeHtml(check.name || check.id || 'unnamed check')}</span><span class="check-tail">${check.pass === true ? 'pass' : check.pass === false ? 'fail' : 'not evaluated'}</span></div>${evidence ? `<details class="evidence"><summary>evidence</summary><div class="evidence-body">${evidence}</div></details>` : ''}</li>`;
    }

    function renderRunBreakdown(run, compact = false) {
      const checks = run.deterministic;
      const judge = obj(run.llmJudge);
      const crossGrades = run.crossGrades;
      return `<div class="subpanel" style="margin-bottom:12px"><h3><a href="#/run/${encodeURIComponent(run.runId)}">${escapeHtml(run.runId)}</a> <span style="float:right">${statusMarkup(run.status)}</span></h3><div class="subpanel-body"><div class="meta-grid"><div class="meta-item"><dt>deterministic score</dt><dd class="mono">${formatScore(run.deterministicScore)}</dd></div><div class="meta-item"><dt>final score</dt><dd class="mono">${formatScore(run.finalScore)}</dd></div><div class="meta-item"><dt>judge</dt><dd>${run.llmJudge === null ? 'deferred / absent' : escapeHtml(judge.verdict || judge.result || 'captured')}</dd></div><div class="meta-item"><dt>cross-grades</dt><dd class="mono">${crossGrades.length}</dd></div></div>${checks.length ? `<ul class="check-list">${checks.map(renderCheck).join('')}</ul>` : '<p class="not-included">No deterministic results captured for this run.</p>'}</div></div>`;
    }

    function renderArtifacts(artifacts, compact = false) {
      if (!artifacts.length) return `<div class="empty-state"><strong>No captured files</strong><p>Artifacts were not included in this results bundle.</p></div>`;
      const byKind = new Map();
      artifacts.forEach((artifact) => { if (!byKind.has(artifact.kind)) byKind.set(artifact.kind, []); byKind.get(artifact.kind).push(artifact); });
      const order = ['primary', 'evidence', 'diagnostic', 'log', 'script', 'artifact'];
      return `<div class="artifact-groups">${order.filter((kind) => byKind.has(kind)).map((kind) => `<div class="artifact-group"><h3>${escapeHtml(kind)}</h3><ul class="artifact-list">${byKind.get(kind).map((artifact) => {
        const path = escapeHtml(artifact.path);
        const target = artifact.url ? `<a href="${escapeAttr(artifact.url)}" target="_blank" rel="noopener">${path}</a>` : `<span class="unavailable">${path}</span>`;
        const status = artifact.url ? '' : '<span class="unavailable">unavailable</span>';
        return `<li class="artifact-item"><span class="artifact-path">${target}${artifact.label && artifact.label !== artifact.path ? `<span class="row-subtitle">${escapeHtml(artifact.label)}</span>` : ''}</span><span class="artifact-kind">${status}</span><span class="artifact-size">${artifact.sizeBytes === null ? 'size —' : escapeHtml(formatBytes(artifact.sizeBytes))}</span></li>`;
      }).join('')}</ul></div>`).join('')}</div>`;
    }

    function renderRunImages(run) {
      const images = Array.isArray(run.images) ? run.images.filter((image) => image && image.url) : [];
      if (!images.length) return '';
      return `<div class="panel"><div class="panel-heading"><h2>Rendered outputs</h2><span class="hint">PCB renders from this run · published from <code>/docs/artifacts/</code></span></div><div class="panel-body"><div class="image-grid">${images.map((image) => {
        const caption = escapeHtml(image.label || image.path || 'rendered output');
        const alt = escapeAttr(image.alt || caption);
        return `<figure class="image-frame"><a href="${escapeAttr(image.url)}" target="_blank" rel="noopener"><img loading="lazy" src="${escapeAttr(image.url)}" alt="${alt}"></a><figcaption>${caption}</figcaption></figure>`;
      }).join('')}</div></div></div>`;
    }

    function renderRunCost(run) {
      const cost = toFiniteNumber(run.costUsd);
      const usage = obj(run.usage);
      const inTokens = toFiniteNumber(usage.input_tokens);
      const outTokens = toFiniteNumber(usage.output_tokens);
      const cap = toFiniteNumber(run.costCap);
      if (cost === null && inTokens === null && outTokens === null) return '';
      const tokensLine = (inTokens !== null || outTokens !== null)
        ? `<div class="meta-item"><dt>tokens</dt><dd class="mono">in ${inTokens === null ? '—' : inTokens.toLocaleString()} · out ${outTokens === null ? '—' : outTokens.toLocaleString()}</dd></div>`
        : '';
      const capLine = cap !== null ? `<div class="row-subtitle">budget cap $${cap.toFixed(2)} is not spend</div>` : '';
      const value = cost !== null ? `$${cost.toFixed(4)}` : 'tokens only';
      const note = cost !== null ? 'captured from CLI JSON envelope' : 'no per-call USD exposed by this CLI';
      return `<div class="panel"><div class="panel-heading"><h2>Cost &amp; token capture</h2><span class="hint">per-invocation spend where the CLI emits it</span></div><div class="panel-body"><div class="score-rail"><div class="score-box"><div class="label">actual cost</div><div class="value">${escapeHtml(value)}</div><div class="sub">${escapeHtml(note)}</div></div><div class="score-box"><div class="label">input tokens</div><div class="value">${inTokens === null ? '—' : inTokens.toLocaleString()}</div><div class="sub">${capLine}</div></div><div class="score-box"><div class="label">output tokens</div><div class="value">${outTokens === null ? '—' : outTokens.toLocaleString()}</div><div class="sub">from CLI JSON envelope</div></div></div></div></div>`;
    }

    function renderTranscript(run) {
      const transcript = run.transcript;
      if (!transcript) return `<div class="empty-state"><strong>Transcript not captured</strong><p>stdout.txt and stderr.txt were not included in the aggregate. The run may still link to those files when a published run directory is available.</p></div>`;
      const tab = runtime.transcriptTab === 'stderr' ? 'stderr' : 'stdout';
      const content = tab === 'stderr' ? transcript.stderr : transcript.stdout;
      const url = tab === 'stderr' ? transcript.stderrUrl : transcript.stdoutUrl;
      const label = content ? prettyValue(content) : (url ? 'Transcript is published as a separate file.' : 'This stream was not captured.');
      return `<div class="transcript-tabs"><button class="transcript-tab${tab === 'stdout' ? ' active' : ''}" type="button" data-transcript="stdout">stdout</button><button class="transcript-tab${tab === 'stderr' ? ' active' : ''}" type="button" data-transcript="stderr">stderr</button></div><div class="transcript-content"><pre>${escapeHtml(label)}</pre>${url ? `<a href="${escapeAttr(url)}" target="_blank" rel="noopener">open published ${tab}.txt ↗</a>` : ''}</div>`;
    }

    function renderToolCalls(run) {
      if (!Array.isArray(run.toolCalls) || !run.toolCalls.length) return `<div class="empty-state"><strong>Tool calls were not captured for this run</strong><p>Agent narrative or transcript text is not treated as a tool-call trace.</p></div>`;
      return `<ol class="check-list">${run.toolCalls.map((call, index) => `<li class="check-item"><div class="check-main"><span class="check-icon pending">${index + 1}</span><span class="check-name mono">${escapeHtml(call.name || call.tool || call.type || 'tool call')}</span></div><pre>${escapeHtml(prettyValue(call))}</pre></li>`).join('')}</ol>`;
    }

    function renderCrossGrades(run) {
      if (!run.crossGrades.length) return '<p class="not-included">No cross-grade records captured.</p>';
      return `<ul class="check-list">${run.crossGrades.map((grade) => `<li class="check-item"><div class="check-main"><span class="check-icon pending">·</span><span class="check-name">${escapeHtml(grade.agent || 'cross-grader')} <span class="row-subtitle mono">${escapeHtml(grade.model || '')}</span></span><span class="check-tail">exit ${has(grade.exit_code) ? escapeHtml(String(grade.exit_code)) : '—'}</span></div>${has(grade.verdict_snippet) ? `<pre>${escapeHtml(grade.verdict_snippet)}</pre>` : ''}</li>`).join('')}</ul>`;
    }

    function renderRunDetail(run) {
      const evalRecord = evalForRun(run);
      const threshold = thresholdFor(evalRecord);
      const title = evalRecord ? evalRecord.title : 'Unknown eval';
      return `<section aria-labelledby="run-title">
        <div class="breadcrumb"><a href="#/overview">Monitor</a><span class="sep">/</span>${evalRecord ? `<a href="#/eval/${encodeURIComponent(evalRecord.id)}">${escapeHtml(evalRecord.id)}</a><span class="sep">/</span>` : ''}<span>Run detail</span><span class="sep">/</span><span>${escapeHtml(run.runId)}</span></div>
        <div class="identity"><div><p class="eyebrow">Run record</p><h1 id="run-title">${escapeHtml(run.runId)}</h1><div class="identity-id"><a href="#/eval/${encodeURIComponent(run.evalId)}">${escapeHtml(title)}</a> · ${escapeHtml(run.evalId)}</div></div><div class="view-actions"><a class="button primary" href="#/eval/${encodeURIComponent(run.evalId)}">← eval detail</a><a class="button ghost" href="#/overview">all runs</a></div></div>
        <dl class="meta-grid"><div class="meta-item"><dt>status</dt><dd>${statusMarkup(run.status)}</dd></div><div class="meta-item"><dt>agent</dt><dd>${escapeHtml(run.agent)}</dd></div><div class="meta-item"><dt>model</dt><dd class="mono">${escapeHtml(run.model || '—')}</dd></div><div class="meta-item"><dt>skill</dt><dd>${chipMarkup(labelSkill(run.skill), run.skill ? 'teal' : 'ochre')}</dd></div><div class="meta-item"><dt>exit code</dt><dd class="mono">${run.exitCode === null ? '—' : escapeHtml(String(run.exitCode))}</dd></div><div class="meta-item"><dt>duration</dt><dd class="mono">${formatDuration(run.durationMs)}</dd></div><div class="meta-item"><dt>started</dt><dd class="time">${escapeHtml(formatDate(run.startedAt))}</dd></div><div class="meta-item"><dt>finished</dt><dd class="time">${escapeHtml(formatDate(run.finishedAt))}</dd></div><div class="meta-item"><dt>graded</dt><dd class="time">${escapeHtml(formatDate(run.gradedAt))}</dd></div><div class="meta-item"><dt>actual cost</dt><dd>${formatCost(run.costUsd)}</dd></div><div class="meta-item"><dt>budget cap</dt><dd class="mono">${run.costCap === null ? '—' : '$' + run.costCap.toFixed(2)}<div class="row-subtitle">cap is not spend</div></dd></div></dl>
        <div class="score-rail"><div class="score-box"><div class="label">final score</div><div class="value ${run.status}">${formatScore(run.finalScore)}</div><div class="sub">best is not implied</div></div><div class="score-box"><div class="label">threshold</div><div class="value">${formatThreshold(threshold)}</div><div class="sub">from eval contract</div></div><div class="score-box"><div class="label">deterministic</div><div class="value">${formatScore(run.deterministicScore)}</div><div class="sub">${run.deterministic.length} check${run.deterministic.length === 1 ? '' : 's'}</div></div><div class="score-box"><div class="label">verdict</div><div class="value ${run.status}">${escapeHtml(statusLabel(run.status))}</div><div class="sub">${run.passed === null ? 'not explicitly graded' : run.passed ? 'passed = true' : 'passed = false'}</div></div><div class="score-box"><div class="label">LLM judge</div><div class="value">${run.llmJudge === null ? 'deferred' : 'captured'}</div><div class="sub">null is not a failed judge</div></div></div>
